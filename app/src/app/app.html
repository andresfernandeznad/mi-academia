<header class="app-header">
  <a routerLink="/" class="wordmark" aria-label="Mi Academia, inicio">mi_academia<span class="caret" aria-hidden="true"></span></a>
  <nav class="actions">
    <a routerLink="/repaso" routerLinkActive="is-active" class="review-link">
      Repaso
      @if (dueCount() > 0) {
        <span class="badge" [attr.aria-label]="dueCount() + ' pendientes'">{{ dueCount() }}</span>
      }
    </a>
    <button type="button" class="theme-toggle" [attr.aria-label]="themeLabel()" [title]="themeLabel()" (click)="theme.cycle()">
      @switch (theme.preference()) {
        @case ('light') {
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        }
        @case ('dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" /></svg>
        }
        @default {
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" /><path d="M8 20h8M12 16v4" /></svg>
        }
      }
    </button>
  </nav>
</header>
<main class="app-main">
  <router-outlet />
</main>
