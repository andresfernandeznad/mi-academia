<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mi Academia</title>
    <meta name="theme-color" content="#e5e5e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Apply a saved light/night choice before first paint (no white flash). Key: ThemeService.
      try {
        var theme = localStorage.getItem('mi-academia:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Activa JavaScript para usar Mi Academia.</noscript>
  </body>
</html>
