name: Keep Supabase awake

# Free Supabase projects are paused after a week without activity. One cheap read every three days
# keeps the project active. Needs the repository secrets SUPABASE_URL and SUPABASE_ANON_KEY.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the review_cards table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY secret missing; nothing to keep awake."
            exit 0
          fi
          # Anonymous request: RLS returns no rows, but the database still serves it.
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/review_cards?select=question_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "Supabase answered."
